[project]
name = "rgi"
version = "0.1.0"
description = "Interactive ripgrep with fzf - search through files interactively"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
authors = [
    { name = "Dan", email = "dan@example.com" }
]
keywords = ["ripgrep", "fzf", "search", "interactive", "grep", "rg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Shells",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]

[project.scripts]
rgi = "rgi.cli:main"
rgi-test = "rgi.test_runner:run_tests"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rgi"]

[tool.hatch.build.targets.wheel.shared-data]
"src/rgi/scripts/rgi" = "rgi/scripts/rgi"
"src/rgi/scripts/rgi-preview" = "rgi/scripts/rgi-preview"

[tool.uv]
package = true
