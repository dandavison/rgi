  # Separate job for Windows testing with WSL
  test-windows:
    name: Test on Windows with WSL (Optional)
    runs-on: windows-latest
    continue-on-error: true # Don't fail the entire workflow if Windows tests fail
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11'] # Test with one Python version for Windows
    timeout-minutes: 20 # Reduced timeout - if it takes longer, something is wrong

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Fix Windows line endings
        shell: wsl-bash {0}
        run: |
          # Convert all shell scripts and Python files to Unix line endings
          echo "Converting line endings to Unix format..."
          find . -type f \( -name "*.sh" -o -name "*.py" -o -name "rgi" -o -name "rgi-*" -o -name "test-interactive" \) -exec dos2unix {} \; 2>/dev/null || \
          find . -type f \( -name "*.sh" -o -name "*.py" -o -name "rgi" -o -name "rgi-*" -o -name "test-interactive" \) -exec sed -i 's/\r$//' {} \;
          echo "Line endings converted"

      - name: Setup WSL
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-22.04
          wsl-shell-user: runner
          additional-packages: |
            tmux
            fzf
            ripgrep
            python3-pip
            python3-venv
            curl
            git

      - name: Install delta in WSL
        shell: wsl-bash {0}
        timeout-minutes: 5
        run: |
          # Install delta binary directly without sudo
          echo "Installing delta..."
          mkdir -p $HOME/.local/bin
          cd /tmp
          curl -LO https://github.com/dandavison/delta/releases/download/0.18.2/delta-0.18.2-x86_64-unknown-linux-gnu.tar.gz
          tar xzf delta-0.18.2-x86_64-unknown-linux-gnu.tar.gz --no-same-owner 2>/dev/null || true
          mv delta-0.18.2-x86_64-unknown-linux-gnu/delta $HOME/.local/bin/
          rm -rf delta-0.18.2-x86_64-unknown-linux-gnu delta-0.18.2-x86_64-unknown-linux-gnu.tar.gz
          cd -
          export PATH="$HOME/.local/bin:$PATH"
          delta --version
          echo "Delta installed successfully"

      - name: Install rgi as a user would (following README)
        shell: wsl-bash {0}
        timeout-minutes: 10
        run: |
          # Install uv as recommended in README
          echo "Installing uv..."
          curl -LsSf https://astral.sh/uv/install.sh | sh
          
          # Add uv to PATH
          export PATH="$HOME/.local/bin:$PATH"

          # Copy project to WSL filesystem to avoid permission issues
          echo "Copying project to WSL filesystem..."
          cp -r . /tmp/rgi-install
          cd /tmp/rgi-install

          # Install rgi using uv tool install as per README
          echo "Installing rgi with uv tool install..."
          uv tool install .

          # Go back to original directory
          cd -

          # Install pytest for testing
          echo "Installing pytest for tests..."
          python3 -m pip install --user pytest pytest-timeout

          echo "Installation complete"

      - name: Verify installations in WSL
        shell: wsl-bash {0}
        timeout-minutes: 2
        run: |
          # Set up PATH for uv, delta, and tools
          export PATH="$HOME/.local/bin:$PATH"

          echo "=== System info ==="
          uname -a
          echo "=== Python version ==="
          python3 --version
          echo "=== uv version ==="
          uv --version
          echo "=== tmux version ==="
          tmux -V
          echo "=== ripgrep version ==="
          rg --version
          echo "=== fzf version ==="
          fzf --version
          echo "=== delta version ==="
          delta --version
          echo "=== pytest installed ==="
          python3 -m pytest --version || echo "pytest not found"
          echo "=== rgi installed ==="
          which rgi
          rgi --help || true  # Test that rgi can be invoked

      - name: Run tests in WSL
        shell: wsl-bash {0}
        timeout-minutes: 10
        run: |
          # Set up PATH for uv, delta, and tools
          export PATH="$HOME/.local/bin:$PATH"

          export TERM=xterm-256color
          export CI=true

          # Run tests against the uv-installed rgi
          python3 -m pytest tests/test_rgi.py::test_basic_pattern_search -v --tb=short --timeout=60
          python3 -m pytest tests/test_rgi.py::test_default_command_mode -v --tb=short --timeout=60

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-windows-py${{ matrix.python-version }}
          path: |
            tests/test-fixture-*
          retention-days: 7
